# Copies this repo's release secrets into another repo, so a new app signs and
# publishes exactly like this one:
#
#   macOS    (7)  Developer ID certificate + notarization key. Apple caps
#                 Developer ID Application certificates at five per team and
#                 will not let you revoke one yourself, so a new app reuses an
#                 existing certificate rather than minting its own.
#   Windows  (6)  Azure Trusted Signing identity and certificate profile.
#   Publish  (4)  SSH deploy key for the mayorana.ch download host.
#
# Each group can be switched off when running it; a group is copied whole or
# not at all, since a partial set fails the release workflow anyway.
#
# Needs a CROSS_REPO_TOKEN secret on this repo: a fine-grained PAT with
# "Secrets: Read and write" on the target repo.
#
# The secret values are decrypted only inside the runner and are re-encrypted
# for the target repo in the same step — they are never written to a file, an
# artifact, or the log.

name: Copy signing secrets

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo to copy the secrets into'
        required: true
        default: 'bennekrouf/splitter'
      macos:
        description: 'macOS signing + notarization (7 secrets)'
        type: boolean
        default: true
      windows:
        description: 'Windows Azure Trusted Signing (6 secrets)'
        type: boolean
        default: true
      publish:
        description: 'Download host deploy key, DIST_SSH_* (4 secrets)'
        type: boolean
        default: true

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pynacl
        run: pip install --quiet pynacl requests

      # Every value arrives as an env var and is read from os.environ, so no
      # secret is ever interpolated into the shell command line.
      - name: Copy secrets to target repo
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          COPY_MACOS: ${{ inputs.macos }}
          COPY_WINDOWS: ${{ inputs.windows }}
          COPY_PUBLISH: ${{ inputs.publish }}
          GH_PAT: ${{ secrets.CROSS_REPO_TOKEN }}
          # macOS
          S_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          S_MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          S_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          S_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          S_APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          S_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Windows
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          S_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          S_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          # Publish
          S_DIST_SSH_KEY: ${{ secrets.DIST_SSH_KEY }}
          S_DIST_SSH_HOST: ${{ secrets.DIST_SSH_HOST }}
          S_DIST_SSH_USER: ${{ secrets.DIST_SSH_USER }}
          S_DIST_SSH_KNOWN_HOSTS: ${{ secrets.DIST_SSH_KNOWN_HOSTS }}
        run: |
          python - <<'PY'
          import base64, os, sys
          import requests
          from nacl import encoding, public

          target = os.environ["TARGET_REPO"]
          token  = os.environ["GH_PAT"]
          if not token:
              sys.exit("::error::CROSS_REPO_TOKEN is not set on this repo.")

          groups = {
              "macOS": ("COPY_MACOS", [
                  "MACOS_CERTIFICATE",
                  "MACOS_CERTIFICATE_PWD",
                  "MACOS_SIGNING_IDENTITY",
                  "KEYCHAIN_PASSWORD",
                  "APP_STORE_CONNECT_KEY",
                  "APP_STORE_CONNECT_KEY_ID",
                  "APP_STORE_CONNECT_ISSUER_ID",
              ]),
              "Windows": ("COPY_WINDOWS", [
                  "AZURE_TENANT_ID",
                  "AZURE_CLIENT_ID",
                  "AZURE_CLIENT_SECRET",
                  "TRUSTED_SIGNING_ENDPOINT",
                  "TRUSTED_SIGNING_ACCOUNT",
                  "TRUSTED_SIGNING_CERT_PROFILE",
              ]),
              "Publish": ("COPY_PUBLISH", [
                  "DIST_SSH_KEY",
                  "DIST_SSH_HOST",
                  "DIST_SSH_USER",
                  "DIST_SSH_KNOWN_HOSTS",
              ]),
          }

          chosen = {g: names for g, (flag, names) in groups.items() if os.environ.get(flag) == "true"}
          if not chosen:
              sys.exit("::error::No group selected — nothing to copy.")

          # Check every selected group before writing anything, so a missing
          # source secret never leaves the target half-configured.
          missing = [n for names in chosen.values() for n in names if not os.environ.get("S_" + n)]
          if missing:
              sys.exit(f"::error::Source repo is missing: {', '.join(missing)}")

          api = "https://api.github.com"
          hdr = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # The target repo's public key is what makes this safe: the value is
          # sealed for that repo specifically and cannot be read back out.
          r = requests.get(f"{api}/repos/{target}/actions/secrets/public-key", headers=hdr, timeout=30)
          if r.status_code != 200:
              sys.exit(f"::error::Cannot read {target} public key (HTTP {r.status_code}). "
                       "Does the PAT grant Secrets: write on that repo?")
          pk = r.json()
          sealed_box = public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))

          failed = False
          count = 0
          for group, names in chosen.items():
              print(f"{group}:")
              for n in names:
                  value = os.environ["S_" + n]
                  encrypted = base64.b64encode(sealed_box.encrypt(value.encode())).decode()
                  resp = requests.put(
                      f"{api}/repos/{target}/actions/secrets/{n}",
                      headers=hdr,
                      json={"encrypted_value": encrypted, "key_id": pk["key_id"]},
                      timeout=30,
                  )
                  # 201 = created, 204 = updated. Only the name is ever printed.
                  if resp.status_code in (201, 204):
                      print(f"  {n}: ok ({resp.status_code})")
                      count += 1
                  else:
                      print(f"::error::  {n}: FAILED ({resp.status_code})")
                      failed = True

          if failed:
              sys.exit(1)
          print(f"\nAll {count} secrets copied to {target} ({', '.join(chosen)}).")
          PY
