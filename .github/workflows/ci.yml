name: CI

# Fast feedback on every pull request.
#
# Every desktop app has this same file. Only the platform list, the Linux
# packages, the binary name in the C runtime check and the paths the release
# note check ignores differ.
#
# release.yml is the heavy pipeline: it only runs on `v*` tags and produces
# signed artifacts. This workflow exists so a regression `cargo test` can
# already see never costs that round trip.
#
# Not on push to main: the PR run already tested that code, and the Release
# run on the tag builds it again. Every PR runs it, docs too: main requires
# these checks, and a check that never starts would hold a PR forever.
on:
  pull_request:

# A newer push on the same ref cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Release notes: blocking ────────────────────────────────────────────────
  # Every PR that changes the app says what changed, in CHANGELOG.md under
  # `## [Unreleased]`. That section is what release.sh stamps with the next
  # version and what the public releases page on mayorana.ch is built from, so
  # a note missing here is a version on that page with nothing written under
  # it. A warning, not a failure: GitAgent's release flow drafts the notes
  # before it releases, so a PR without them is reminded rather than blocked.
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md [Unreleased]
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read now rather than from the event, which no longer re-runs on a
          # label change: add the label, then re-run this job.
          if gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx no-notes; then
            echo "Labelled no-notes — skipping."
            exit 0
          fi

          # Files that never reach a user: nothing to announce when only these move.
          APP_FILES=$(git diff --name-only "$BASE"..."$HEAD" \
            | grep -vE '^(\.github/|\.githooks/|scripts/|docs/|tests/|testdata/|homebrew/)|\.md$|^(LICENSE|\.gitignore)$' \
            || true)
          if [[ -z "$APP_FILES" ]]; then
            echo "No app files changed — no note needed."
            exit 0
          fi

          ADDED=$(git diff "$BASE"..."$HEAD" -- CHANGELOG.md | grep -cE '^\+\s*- ' || true)
          UNRELEASED=$(awk '/^## \[[Uu]nreleased\]/{f=1;next} /^## /{f=0} f && /^- /{n++} END{print n+0}' CHANGELOG.md)
          if [[ "$ADDED" -gt 0 && "$UNRELEASED" -gt 0 ]]; then
            echo "CHANGELOG.md has $UNRELEASED note(s) under [Unreleased]."
            exit 0
          fi

          echo "::warning file=CHANGELOG.md::This PR changes the app but adds no release note."
          echo "Changed app files:"
          echo "$APP_FILES" | sed 's/^/  /'
          echo
          echo "The release flow will draft the notes under '## [Unreleased]' before it"
          echo "releases. To write them now instead, add a bullet there under ### Added,"
          echo "Changed, Fixed or Removed, for someone using the app."

  # ── Formatting: blocking ───────────────────────────────────────────────────
  # No compile, reports in ~20s. .githooks/pre-commit formats what is staged,
  # so this is a real gate rather than a check that is red forever.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # desktop-kit, the code every desktop app shares, sits beside the app
      # (Cargo.toml: path = "../desktop-kit"): its branch of the same name as
      # this pull request's when there is one, so a change to both builds
      # together whichever is pushed first; main otherwise, and for a release.
      - name: Put desktop-kit beside the app
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          url=https://github.com/bennekrouf/desktop-kit.git
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
            ref=$BRANCH
          fi
          git clone --quiet --depth 1 --branch "$ref" "$url" ../desktop-kit
          echo "desktop-kit $ref at $(git -C ../desktop-kit rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          # The kit as it is now in Cargo.lock: its version and the crates it
          # needs. Nothing else moves, and --locked holds for the rest. Only
          # where the app is checked out: a job may fetch the kit without it.
          if [ -f Cargo.toml ]; then
            rustup toolchain install >/dev/null
            cargo update --quiet -p desktop-kit
          fi

      # Installs the version and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # ── Tests + clippy: blocking, on Linux, macOS and Windows ───────────────────
  # The release builds for each of these; testing on one would leave the
  # others to be found out at release time.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release-check: true
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # desktop-kit, the code every desktop app shares, sits beside the app
      # (Cargo.toml: path = "../desktop-kit"): its branch of the same name as
      # this pull request's when there is one, so a change to both builds
      # together whichever is pushed first; main otherwise, and for a release.
      - name: Put desktop-kit beside the app
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          url=https://github.com/bennekrouf/desktop-kit.git
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
            ref=$BRANCH
          fi
          git clone --quiet --depth 1 --branch "$ref" "$url" ../desktop-kit
          echo "desktop-kit $ref at $(git -C ../desktop-kit rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          # The kit as it is now in Cargo.lock: its version and the crates it
          # needs. Nothing else moves, and --locked holds for the rest. Only
          # where the app is checked out: a job may fetch the kit without it.
          if [ -f Cargo.toml ]; then
            rustup toolchain install >/dev/null
            cargo update --quiet -p desktop-kit
          fi

      # Installs the version and components rust-toolchain.toml pins.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Dioxus desktop links GTK/WebKit even for unit tests; libssl-dev is for
      # native-tls, which uses OpenSSL on Linux.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      # --locked fails the run if Cargo.lock has drifted from Cargo.toml.
      - name: Test
        run: cargo test --workspace --locked

      # Dioxus expands rsx! differently in release builds: a component key
      # that reads a prop moved into the same component compiles in debug and
      # fails in release. Catch that here, not at tag time. On Linux only,
      # since it is a second full build.
      - name: Release-mode check
        if: matrix.release-check
        run: cargo check --workspace --release --locked

      # The app must start on a PC without the Visual C++ Redistributable, so
      # the .exe may not import VCRUNTIME140*.dll (see .cargo/config.toml).
      # Debug links the same C runtime as release.
      - name: Check static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p gitagent --locked
          ./scripts/check-windows-crt.ps1 target\debug\gitagent.exe

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
