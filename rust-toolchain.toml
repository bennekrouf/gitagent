# The Rust version for every build: local, CI and releases. rustup installs it on first use.
#
# CI runs clippy with -D warnings, and each stable release brings new lints, so an unpinned
# toolchain can turn CI red without a code change. Bump this on purpose, in all the desktop
# apps at once, and fix whatever the new clippy reports in the same change.
[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
profile = "minimal"
