[package]
name = "gitagent"
version = "0.1.0"
edition = "2021"
description = "Agentic graph for commit and deploy workflows"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rfd = "0.15"
dark-light = "1"
futures-util = "0.3"
toml = "0.8"
