[package]
name = "gitagent"
version = "0.1.92"
edition = "2021"
license-file = "LICENSE"
description = "Agentic graph for commit and deploy workflows"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rfd = "0.15"
dark-light = "1"
futures-util = "0.3"
# Decodes assets/icon.png into the runtime window icon; png is the only
# format needed.
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"
notify-rust = "4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Pro licences: checked offline against the public half of mayorana.ch's
# signing key.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
# The anonymous install identifier is 128 random bits. Already in the tree via
# other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
