[package]
name = "gitagent"
version = "0.1.143"
edition = "2021"
license-file = "LICENSE"
description = "Agentic graph for commit and deploy workflows"

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and
# licence. Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit", features = ["ui"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rfd = "0.15"
dark-light = "1"
futures-util = "0.3"
# Decodes assets/icon.png into the runtime window icon; png is the only
# format needed.
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"
notify-rust = "4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Usage statistics ride in the query string, base64url-encoded.
base64 = "0.22"
# The anonymous install identifier is 128 random bits. Already in the tree via
# other crates, so this names a dependency rather than adding one.
getrandom = "0.3"
# canonicalize without the `\\?\` prefix Windows puts on it, so a path
# handed back over MCP matches the one that was sent. Already in the tree.
dunce = "1"

# Holding off App Nap while a run is going (services::awake). Both already in
# the tree through the window and notification crates, at these versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
